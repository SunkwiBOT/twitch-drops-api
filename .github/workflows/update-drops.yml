name: 📝 Update JSON files

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  fetch-drops:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: 🛠️ Checkout code

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: 📄 Update drops JSON
        run: bun run fetch-drops.ts
        env:
          CI: true
          # Optional repository secret: a free key from dropsalerts.com/dashboard.
          DROPS_API_KEY: ${{ secrets.DROPS_API_KEY }}

      - name: 📤 Upload drops artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drops-json
          path: drops.json

  fetch-rewards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: 🛠️ Checkout code

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: 🎁 Update rewards JSON
        run: bun run fetch-rewards.ts
        env:
          CI: true
          # Optional repository secret: a free key from dropsalerts.com/dashboard.
          DROPS_API_KEY: ${{ secrets.DROPS_API_KEY }}

      - name: 📤 Upload rewards artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewards-json
          path: rewards.json

  fetch-badges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: 🛠️ Checkout code

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: 🏅 Update badges JSON
        run: bun run fetch-badges.ts
        env:
          CI: true
          # Optional repository secret: a free key from dropsalerts.com/dashboard.
          DROPS_API_KEY: ${{ secrets.DROPS_API_KEY }}

      - name: 📤 Upload badges artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badges-json
          path: badges.json

  commit-changes:
    runs-on: ubuntu-latest
    needs: [fetch-drops, fetch-rewards, fetch-badges]
    # ! A fork's scheduled run would commit the refreshed data to the fork.
    if: github.repository == 'SunkwiBOT/twitch-drops-api'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: 🛠️ Checkout code

      - name: 📥 Download drops artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drops-json

      - name: 📥 Download rewards artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rewards-json

      - name: 📥 Download badges artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: badges-json

      - name: 🕒 Generate timestamp
        id: timestamp
        run: echo "datetime=$(TZ='Europe/Paris' date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

      - name: 💻 Commit changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          force: false
          signoff: false
          author_name: ${{ vars.GB_USER }}
          author_email: ${{ vars.GB_EMAIL }}
          message: "✏️ JSON files updated - ${{ steps.timestamp.outputs.datetime }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
